<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Cyber Background Hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#050811" stroke="#00f3ff" stroke-width="2.5" />
  
  <!-- Inner Cyber Accent Polygon -->
  <polygon points="50,11 86,30 86,70 50,89 14,70 14,30" fill="none" stroke="rgba(176, 38, 255, 0.4)" stroke-width="1.2" stroke-dasharray="6 3" />

  <!-- Corner Reticles -->
  <line x1="8" y1="26" x2="18" y2="26" stroke="#00f3ff" stroke-width="3" />
  <line x1="8" y1="26" x2="8" y2="36" stroke="#00f3ff" stroke-width="3" />
  
  <line x1="92" y1="74" x2="82" y2="74" stroke="#b026ff" stroke-width="3" />
  <line x1="92" y1="74" x2="92" y2="64" stroke="#b026ff" stroke-width="3" />

  <!-- Central "EM" Monogram -->
  <!-- Letter E -->
  <path d="M 28 32 L 46 32 M 28 32 L 28 68 M 28 50 L 42 50 M 28 68 L 46 68" 
        stroke="url(#cyberCyan)" 
        stroke-width="5" 
        stroke-linecap="square" 
        stroke-linejoin="miter" 
        fill="none" 
        filter="url(#neonGlow)" />

  <!-- Letter M -->
  <path d="M 52 68 L 52 32 L 62 48 L 72 32 L 72 68" 
        stroke="url(#cyberPurple)" 
        stroke-width="5" 
        stroke-linecap="square" 
        stroke-linejoin="miter" 
        fill="none" 
        filter="url(#neonGlow)" />

  <!-- Cybernetic Node Dots -->
  <circle cx="50" cy="96" r="3" fill="#00f3ff" />
  <circle cx="50" cy="4" r="3" fill="#b026ff" />
  <circle cx="92" cy="26" r="2.5" fill="#00f3ff" />
  <circle cx="8" cy="74" r="2.5" fill="#b026ff" />
</svg>
